<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>API Inventory Backend</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; border: 1px solid #334155; text-align: center; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 0.35rem 0.85rem; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>نظام إدارة المخزون والمبيعات - API Backend</h1>
    <p>واجهة برمجة التطبيقات (API) تعمل بنجاح وجاهزة لاستقبال طلبات الـ Frontend.</p>
    <div class="badge">Status: Online & Healthy (200 OK)</div>

</html>
